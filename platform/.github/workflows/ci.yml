name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the build if a secret was committed. Runs first, always.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  changes:
    name: Detect changed lanes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      integrations: ${{ steps.filter.outputs.integrations }}
      mobile: ${{ steps.filter.outputs.mobile }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/shared/**'
            integrations:
              - 'services/integrations/**'
              - 'packages/shared/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/shared/**'
            db:
              - 'db/**'

  node:
    name: Node (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.integrations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, integrations]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm test --if-present

  flutter:
    name: Flutter (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  migrations:
    name: DB migrations have a down
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every up migration has a matching down
        run: |
          missing=0
          for up in db/migrations/*_up.sql; do
            [ -e "$up" ] || continue
            down="${up%_up.sql}_down.sql"
            if [ ! -f "$down" ]; then
              echo "::error file=$up::No matching down migration ($down)"
              missing=1
            fi
          done
          exit $missing

  deploy:
    name: Deploy to Netlify
    needs: [changes, flutter]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './apps/mobile/build/web'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  build-apk:
    name: Build Android APK
    needs: [changes, flutter]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agroedge-farmer-app
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

