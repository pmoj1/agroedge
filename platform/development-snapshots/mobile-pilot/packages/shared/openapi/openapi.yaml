openapi: 3.1.0

info:
  title: AgroEdge API
  version: 0.1.0
  license:
    name: Proprietary
  description: >
    Contract for the AgroEdge Fastify API (services/api). Covers the 14
    farmer-owned resource tables defined in
    db/migrations/20260710000000_init_schema_up.sql. Every operation below is
    scoped to the authenticated user, mirroring the Postgres row-level
    security policies created in that same migration -- the API never
    exposes another user's rows. This is a working MVP contract, not a
    finished public API, and will change by pull request only (see
    packages/shared/CLAUDE.md).

    `owner_user` is used as the farmer identifier throughout this contract,
    matching the current schema. A pseudonymous-identifier split is a known
    gap tracked separately (see db/CLAUDE.md) and is not reflected here yet.

servers:
  - url: http://localhost:3000
    description: >
      Local development (services/api). Production URLs are environment
      configuration, not committed here.

security:
  - supabaseAuth: []

tags:
  - name: Farm Profiles
    description: Farmer-submitted farm metadata -- size, location, crops grown. A farmer may have more than one.
  - name: Activities
    description: Logged farm activities (planting, spraying, harvest, etc.) tied to a crop and date.
  - name: Activity Files
    description: Photo, receipt, or document attachments, nested under the activity they belong to.
  - name: Expenses
    description: Farmer-logged input costs, scoped to a season.
  - name: Income Records
    description: Farmer-logged sales and revenue, scoped to a season.
  - name: Season Budgets
    description: Per-season budget targets by category.
  - name: AI Crop Plans
    description: AI agronomist crop recommendations generated for a farmer.
  - name: AI Insights
    description: AI-generated insights surfaced to a farmer, grouped by category.
  - name: AI Messages
    description: Chat log between a farmer and the AI agronomist.
  - name: Communication Preferences
    description: Per-farmer notification channel opt-ins (email, SMS, WhatsApp, in-app).
  - name: Notifications
    description: Notifications queued or delivered to a farmer.
  - name: Notification Delivery Logs
    description: Delivery attempts and outcomes for a notification, nested under it.
  - name: Reminders
    description: Scheduled reminders for a farmer, optionally linked to an activity.
  - name: Weekly Reports
    description: Weekly summary reports generated for a farmer.

