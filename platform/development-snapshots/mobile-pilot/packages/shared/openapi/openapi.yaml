      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Expense'}}
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer}

    # --- income_records -------------------------------------------------
    IncomeRecord:
      type: object
      description: Bubble source table -- IncomeRecord.
      required: [id, owner_user, income_date, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        owner_user: {type: string, format: uuid, readOnly: true}
        crop: {type: [string, "null"]}
        buyer: {type: [string, "null"]}
        income_date: {type: string, format: date}
        price_per_unit: {type: [number, "null"]}
        quantity_sold: {type: [number, "null"]}
        total_revenue: {type: [number, "null"]}
        season_label: {type: [string, "null"]}
        document_file_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    IncomeRecordCreate:
      type: object
      required: [income_date]
      properties:
        crop: {type: [string, "null"]}
        buyer: {type: [string, "null"]}
        income_date: {type: string, format: date}
        price_per_unit: {type: [number, "null"]}
        quantity_sold: {type: [number, "null"]}
        total_revenue: {type: [number, "null"]}
        season_label: {type: [string, "null"]}
        document_file_id: {type: [string, "null"], format: uuid}
    IncomeRecordUpdate:
      type: object
      properties:
        crop: {type: [string, "null"]}
        buyer: {type: [string, "null"]}
        income_date: {type: string, format: date}
        price_per_unit: {type: [number, "null"]}
        quantity_sold: {type: [number, "null"]}
        total_revenue: {type: [number, "null"]}
        season_label: {type: [string, "null"]}
