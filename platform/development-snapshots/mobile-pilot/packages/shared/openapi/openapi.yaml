components:
  securitySchemes:
    supabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT. Row-level security policies key off auth.uid().

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Resource ID.
    ActivityIdParam:
      name: activityId
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Parent activity ID.
    NotificationIdParam:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Parent notification ID.
    LimitParam:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    OffsetParam:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}

  responses:
    Unauthorized:
      description: Missing or invalid Supabase auth token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: >
        Resource does not exist, or is not owned by the authenticated user
        (row-level security makes these indistinguishable by design).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}

  schemas:
    ApiError:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code: {type: [string, "null"]}

    # --- farm_profiles ---------------------------------------------------
    FarmProfile:
      type: object
      description: Bubble source table -- FarmProfile.
      required: [id, owner_user, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        owner_user: {type: string, format: uuid, readOnly: true}
        farm_name: {type: [string, "null"]}
        farm_size: {type: [number, "null"]}
        farm_type: {type: [string, "null"]}
        country: {type: [string, "null"]}
        region: {type: [string, "null"]}
        gps_lat: {type: [number, "null"]}
        gps_lng: {type: [number, "null"]}
        primary_crop: {type: [string, "null"]}
        secondary_crop: {type: [string, "null"]}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    FarmProfileCreate:
      type: object
      properties:
        farm_name: {type: [string, "null"]}
        farm_size: {type: [number, "null"]}
        farm_type: {type: [string, "null"]}
        country: {type: [string, "null"]}
        region: {type: [string, "null"]}
        gps_lat: {type: [number, "null"]}
        gps_lng: {type: [number, "null"]}
        primary_crop: {type: [string, "null"]}
        secondary_crop: {type: [string, "null"]}
    FarmProfileListResponse:
      type: object
      required: [data, limit, offset, total]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/FarmProfile'}}
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer}

    # --- activities --------------------------------------------------------
    Activity:
      type: object
      description: Bubble source table -- Activity.
      required: [id, owner_user, activity_type, activity_date, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        owner_user: {type: string, format: uuid, readOnly: true}
        activity_type: {type: string}
        crop: {type: [string, "null"]}
        activity_date: {type: string, format: date}
        gps_lat: {type: [number, "null"]}
        gps_lng: {type: [number, "null"]}
        notes: {type: [string, "null"]}
        season_label: {type: [string, "null"]}
        yield_quantity: {type: [number, "null"]}
        yield_unit: {type: [string, "null"]}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    ActivityCreate:
      type: object
      required: [activity_type, activity_date]
      properties:
        activity_type: {type: string}
        crop: {type: [string, "null"]}
        activity_date: {type: string, format: date}
        gps_lat: {type: [number, "null"]}
        gps_lng: {type: [number, "null"]}
        notes: {type: [string, "null"]}
        season_label: {type: [string, "null"]}
        yield_quantity: {type: [number, "null"]}
        yield_unit: {type: [string, "null"]}
    ActivityUpdate:
      type: object
      properties:
        activity_type: {type: string}
        crop: {type: [string, "null"]}
        activity_date: {type: string, format: date}
        gps_lat: {type: [number, "null"]}
        gps_lng: {type: [number, "null"]}
        notes: {type: [string, "null"]}
        season_label: {type: [string, "null"]}
        yield_quantity: {type: [number, "null"]}
        yield_unit: {type: [string, "null"]}
    ActivityListResponse:
      type: object
      required: [data, limit, offset, total]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Activity'}}
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer}

    # --- activity_files ------------------------------------------------
    ActivityFile:
      type: object
      description: >
        Bubble source table -- ActivityFile. Used as the "photo"/"receipt"/
        "document" attachment type across Activity, Expense and
        IncomeRecord. RLS is scoped via a join to the parent activity's
        owner_user, not a direct owner_user column on this table.
      required: [id, activity_id, storage_path, created_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        activity_id: {type: string, format: uuid, readOnly: true}
        storage_path: {type: string, description: "Supabase Storage object path, not a public URL."}
        file_type: {type: [string, "null"]}
        created_at: {type: string, format: date-time, readOnly: true}
    ActivityFileCreate:
      type: object
      required: [storage_path]
      properties:
        storage_path: {type: string, description: "Supabase Storage object path, not a public URL."}
        file_type: {type: [string, "null"]}
    ActivityFileUpdate:
      type: object
      properties:
        storage_path: {type: string, description: "Supabase Storage object path, not a public URL."}
        file_type: {type: [string, "null"]}
    ActivityFileListResponse:
      type: object
      required: [data, limit, offset, total]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ActivityFile'}}
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer}

    # --- expenses -----------------------------------------------------
    Expense:
      type: object
      description: Bubble source table -- Expense.
      required: [id, owner_user, amount, expense_date, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        owner_user: {type: string, format: uuid, readOnly: true}
        amount: {type: number}
        category: {type: [string, "null"]}
        expense_date: {type: string, format: date}
        notes: {type: [string, "null"]}
        season_label: {type: [string, "null"]}
        receipt_file_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    ExpenseCreate:
      type: object
      required: [amount, expense_date]
      properties:
        amount: {type: number}
        category: {type: [string, "null"]}
        expense_date: {type: string, format: date}
        notes: {type: [string, "null"]}
        season_label: {type: [string, "null"]}
        receipt_file_id: {type: [string, "null"], format: uuid}
    ExpenseUpdate:
      type: object
